<header class="pt-topbar">
  <a class="pt-brand" routerLink="/">
    <span class="pt-brand__mark"><app-icon name="logo" [size]="44" /></span>
    <span class="pt-brand__name">{{ t.app.name }}</span>
  </a>
  <app-year-switcher
    class="year"
    [year]="selectedYear.year()"
    [currentYear]="selectedYear.currentYear"
    (previous)="selectedYear.previous()"
    (next)="selectedYear.next()"
    (thisYear)="selectedYear.reset()"
  />
  <div class="pt-topbar__actions">
    <a
      class="pt-icon-btn backup"
      routerLink="/settings"
      [attr.data-tone]="backupTone()"
      [attr.aria-label]="backupLabel()"
      [attr.title]="backupLabel()"
    >
      <app-icon name="save" [size]="20" />
    </a>
    <a
      class="pt-icon-btn"
      routerLink="/settings"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [attr.aria-label]="t.nav.settings"
    >
      <app-icon name="settings" [size]="20" />
    </a>
  </div>
</header>
