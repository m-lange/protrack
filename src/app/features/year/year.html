<div class="pt-page-head">
  <div>
    <h1 class="pt-page-title">{{ t.year.title }}</h1>
  </div>
</div>

<section [attr.aria-label]="t.year.calendarTitle(year())">
  <div class="months">
    @for (month of months(); track month.month) {
      <app-month-calendar [month]="month" [year]="year()" />
    }
  </div>
</section>
